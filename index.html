<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4f0">
  <title>Stamped — Stamp Collection</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f4f0;
      --ink: #26241f;
      --muted: #777168;
      --line: #e2ddd3;
      --accent: #6b7a5e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Iowan Old Style", serif;
      overflow-x: hidden;
    }

    header {
      max-width: 1100px;
      margin: auto;
      padding: 48px 24px 24px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); font-weight: 400; }
    .count, .eyebrow, figcaption, .details, footer {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .count, .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .intro { max-width: 1100px; margin: 0 auto; padding: 0 24px 20px; color: var(--muted); font-size: 16px; }

    main { display: flex; flex-direction: column; gap: 16px; padding: 8px 0 64px; }
    .row {
      width: 100%; overflow: hidden; position: relative;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 60px, #000 calc(100% - 60px), transparent);
      mask-image: linear-gradient(to right, transparent, #000 60px, #000 calc(100% - 60px), transparent);
    }
    .track { display: flex; gap: 16px; width: max-content; animation: drift 48s linear infinite; }
    .row:nth-child(2) .track { animation-direction: reverse; }
    .row:hover .track, .row:focus-within .track { animation-play-state: paused; }
    @keyframes drift { to { transform: translateX(-50%); } }

    figure {
      position: relative; flex: 0 0 auto; width: clamp(240px, 34vw, 360px); height: 220px;
      margin: 0; overflow: hidden; border-radius: 5px; background: var(--line); cursor: zoom-in;
    }
    figure img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
    figure:hover img { transform: scale(1.035); }
    figcaption {
      position: absolute; inset: auto 0 0; padding: 28px 14px 12px; color: white;
      font-size: 12px; letter-spacing: .04em;
      background: linear-gradient(transparent, rgb(0 0 0 / 65%));
    }
    figure:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .lightbox {
      position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center;
      padding: 20px; background: rgb(20 18 15 / 88%);
    }
    .lightbox.open { display: flex; }
    .card {
      position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, .75fr);
      width: min(900px, 100%); max-height: 92vh; overflow: auto; border-radius: 8px;
      background: var(--paper); box-shadow: 0 30px 80px rgb(0 0 0 / 40%);
    }
    .large-image { display: grid; place-items: center; min-height: 280px; background: var(--line); }
    .large-image img { display: block; width: 100%; height: 100%; max-height: 80vh; object-fit: contain; }
    .details { display: flex; flex-direction: column; gap: 18px; padding: 50px 28px 28px; }
    .details h2 { margin: 0; font: 400 25px Georgia, "Iowan Old Style", serif; }
    .details p { margin: 0; line-height: 1.65; }
    .date { color: var(--muted); font-size: 13px; }
    .close {
      position: absolute; top: 10px; right: 14px; z-index: 1; border: 0; background: transparent;
      color: var(--ink); cursor: pointer; font-size: 30px; line-height: 1;
    }
    footer { padding: 0 24px 32px; text-align: center; color: var(--muted); font-size: 12px; }

    @media (max-width: 640px) {
      header { padding-top: 32px; }
      .card { grid-template-columns: 1fr; }
      .large-image { min-height: 220px; }
      .large-image img { max-height: 52vh; }
      .details { padding: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .track { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Stamped</h1>
    <span class="count" id="count"></span>
  </header>
  <p class="intro"><span class="eyebrow">A growing collection</span><br>Stamps, places, and memories collected over time.</p>

  <main id="gallery" aria-label="Three rows of stamp collection photos"></main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <section class="card">
      <button class="close" id="close" type="button" aria-label="Close photo">&times;</button>
      <div class="large-image"><img id="large-image" src="" alt=""></div>
      <div class="details">
        <span class="eyebrow">Collection entry</span>
        <h2 id="detail-title"></h2>
        <p class="date">Collected <time datetime="2026-11-06">6 November 2026</time></p>
        <p>A photo of two illustrated Malaysia stamp designs, kept as a memory from the collection.</p>
      </div>
    </section>
  </div>
  <footer>More collection photos can be added as image files in this repository.</footer>

  <script>
    // Add each new photo here. Keep its image file in the repository beside index.html.
    const photos = [
      {
        src: "images.jpeg",
        alt: "Two illustrated Malaysia stamp designs held in front of a display",
        caption: "Stamp collection · 6 November 2026",
        title: "Two Malaysia stamp designs"
      }
    ];

    const gallery = document.getElementById("gallery");
    document.getElementById("count").textContent = `${photos.length} ${photos.length === 1 ? "photo" : "photos"}`;

    // Three image rows; duplicate each set so the scrolling lanes can loop.
    for (let rowIndex = 0; rowIndex < 3; rowIndex += 1) {
      const row = document.createElement("div");
      row.className = "row";
      const track = document.createElement("div");
      track.className = "track";

      [...photos, ...photos].forEach((photo) => {
        const figure = document.createElement("figure");
        figure.tabIndex = 0;
        figure.setAttribute("role", "button");
        figure.setAttribute("aria-label", `View ${photo.title}`);
        const image = document.createElement("img");
        image.src = photo.src;
        image.alt = photo.alt;
        image.loading = "lazy";
        const caption = document.createElement("figcaption");
        caption.textContent = photo.caption;
        figure.append(image, caption);
        figure.addEventListener("click", () => openPhoto(photo));
        figure.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openPhoto(photo);
          }
        });
        track.appendChild(figure);
      });

      row.appendChild(track);
      gallery.appendChild(row);
    }

    const lightbox = document.getElementById("lightbox");
    const largeImage = document.getElementById("large-image");
    const closeButton = document.getElementById("close");

    function openPhoto(photo) {
      largeImage.src = photo.src;
      largeImage.alt = photo.alt;
      document.getElementById("detail-title").textContent = photo.title;
      lightbox.classList.add("open");
      closeButton.focus();
    }

    function closePhoto() {
      lightbox.classList.remove("open");
    }

    closeButton.addEventListener("click", closePhoto);
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) closePhoto();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closePhoto();
    });
  </script>
</body>
</html>
