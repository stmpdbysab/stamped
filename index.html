<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stamped</title>
<style>
  :root {
    --bg: #f6f4f0;
    --ink: #1c1a17;
    --muted: #7a756c;
    --line: #e2ddd3;
    --accent: #6b7a5e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    overflow-x: hidden;
  }

  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 {
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .count {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  main {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px 0 80px;
  }

  .row {
    position: relative;
    width: 100%;
    overflow: hidden;
    mask-image: linear-gradient(to right, transparent 0, black 60px, black calc(100% - 60px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 60px, black calc(100% - 60px), transparent 100%);
  }

  .track {
    display: flex;
    gap: 16px;
    width: max-content;
    animation-duration: 90s;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .row:hover .track {
    animation-play-state: paused;
  }

  .row-right .track {
    animation-name: scrollRight;
  }

  .row-left .track {
    animation-name: scrollLeft;
  }

  /* Right-moving row starts shifted left by one set-width, so content enters from the left */
  @keyframes scrollRight {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0%); }
  }

  @keyframes scrollLeft {
    from { transform: translateX(0%); }
    to   { transform: translateX(-50%); }
  }

  figure {
    margin: 0;
    flex: 0 0 auto;
    width: 260px;
    height: 190px;
    overflow: hidden;
    border-radius: 4px;
    cursor: zoom-in;
    background: var(--line);
    position: relative;
  }

  figure img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 1.2s ease;
  }

  figure:hover img {
    transform: scale(1.05);
  }

  figcaption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 10px 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  figure:hover figcaption { opacity: 1; }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 15, 0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }

  .lightbox.open { display: flex; }

  .detail-card {
    background: var(--bg);
    width: 100%;
    max-width: 780px;
    max-height: 88vh;
    border-radius: 8px;
    overflow: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    position: relative;
  }

  @media (max-width: 640px) {
    .detail-card { grid-template-columns: 1fr; max-height: 92vh; }
  }

  .detail-image {
    background: var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 260px;
  }

  .detail-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .detail-info {
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .detail-info h2 {
    margin: 0;
    font-weight: 400;
    font-size: 24px;
    letter-spacing: -0.01em;
  }

  .detail-meta {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 14px;
    row-gap: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
  }

  .detail-meta dt {
    color: var(--muted);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.08em;
    padding-top: 2px;
  }

  .detail-meta dd {
    margin: 0;
    color: var(--ink);
  }

  .maps-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    align-self: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 2px;
  }

  .maps-link:hover { opacity: 0.7; }

  .detail-description {
    margin: 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
  }

  .close {
    position: absolute;
    top: 14px;
    right: 18px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 26px;
    line-height: 1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    z-index: 1;
  }

  .close:hover { color: var(--accent); }

  .close:focus-visible, figure:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; }
    figure img, figcaption { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Gallery</h1>
  <span class="count" id="count"></span>
</header>

<main id="main"></main>

<div class="lightbox" id="lightbox">
  <div class="detail-card">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <div class="detail-image">
      <img id="lightbox-img" src="" alt="">
    </div>
    <div class="detail-info">
      <h2 id="detail-title"></h2>
      <dl class="detail-meta">
        <dt>Stamp provider</dt>
        <dd id="detail-provider"></dd>
        <dt>State, Country</dt>
        <dd id="detail-state"></dd>
        <dt>Location</dt>
        <dd id="detail-location"></dd>
      </dl>
      <a class="maps-link" id="detail-maps" href="#" target="_blank" rel="noopener">View on Google Maps &#8594;</a>
      <p class="detail-description" id="detail-description"></p>
    </div>
  </div>
</div>

      caption: "PaperOne x Loka Made",
      title: "PaperOne x Loka Made",
      provider: "PaperOne x Loka Made",
      stateCountry: "Kuala Lumpur, Malaysia",
      location: "PaperOne x Loka Made Booth",
      description: "A two-tone stamp collaboration blending PaperOne's paper-plane motif with panda and skyline illustrations by Loka Made."
    },
  ];

  // Give each row a different order so the three lanes don't look identical.
  const rows = [
    [0, 1, 2, 3, 4, 5, 6],
    [4, 5, 6, 0, 1, 2, 3],
    [2, 3, 4, 5, 6, 0, 1],
  ].map(order => order.map(i => photoSet[i]));

  const main = document.getElementById('main');
  const countEl = document.getElementById('count');
  const allPhotos = [];

  rows.forEach((photos, rowIndex) => {
    const isOdd = (rowIndex + 1) % 2 === 1; // row 1, 3 => odd => move right
    const rowEl = document.createElement('div');
    rowEl.className = 'row ' + (isOdd ? 'row-right' : 'row-left');

    const track = document.createElement('div');
    track.className = 'track';

    // duplicate the set for a seamless loop
    const doubled = [...photos, ...photos];
    doubled.forEach(p => {
      allPhotos.push(p);
      const fig = document.createElement('figure');
      fig.tabIndex = 0;
      fig.innerHTML = `<img src="${p.src}" alt="${p.caption}" loading="lazy"><figcaption>${p.caption}</figcaption>`;
      fig.addEventListener('click', () => openLightbox(p));
      fig.addEventListener('keydown', e => { if (e.key === 'Enter') openLightbox(p); });
      track.appendChild(fig);
    });

    rowEl.appendChild(track);
    main.appendChild(rowEl);
  });

  countEl.textContent = rows.flat().length + ' photos';

  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightbox-img');
  const detailTitle = document.getElementById('detail-title');
  const detailProvider = document.getElementById('detail-provider');
  const detailState = document.getElementById('detail-state');
  const detailLocation = document.getElementById('detail-location');
  const detailMaps = document.getElementById('detail-maps');
  const detailDescription = document.getElementById('detail-description');

  function openLightbox(p) {
    lbImg.src = p.src;
    lbImg.alt = p.title;
    detailTitle.textContent = p.title;
    detailProvider.textContent = p.provider;
    detailState.textContent = p.stateCountry;
    detailLocation.textContent = p.location;
    detailMaps.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.location + ', ' + p.stateCountry);
    detailDescription.textContent = p.description;
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
  }

  document.getElementById('close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });
</script>
